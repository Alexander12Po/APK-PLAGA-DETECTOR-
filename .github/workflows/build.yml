name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Compilar el APK
        run: |
          set +e
          intento=1
          max_intentos=5
          exito=1
          while [ $intento -le $max_intentos ]; do
            echo "=== Intento $intento de $max_intentos ==="
            yes | buildozer android debug
            resultado=$?
            if [ $resultado -eq 0 ]; then
              exito=0
              break
            fi
            echo "Fallo (probable caida del servidor de descarga). Esperando 30 segundos antes de reintentar..."
            sleep 30
            intento=$((intento + 1))
          done
          exit $exito

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: agrowillay-apk
          path: bin/*.apk
